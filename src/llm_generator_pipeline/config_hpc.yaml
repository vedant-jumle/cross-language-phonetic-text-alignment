# HPC (DelftBlue) configuration — use with slurm_train.sh
# Run from: /scratch/vvjumle/ir-pipeline/
# Submit with: sbatch slurm_train.sh

---

# sampling
sample_size: 1000000
sample_seed: 42

# LLM (local HF inference)
hf_model_id: "/scratch/vvjumle/models/Llama-3.1-8B-Instruct"
batch_size: 4

# Anthropic Batch API
anthropic_api_key: ""
max_names: 100000

# perturbation
n_perturbations: 4
target_scripts:
  - ar
  - ru
  - zh
  - ja
  - he
  - hi
  - el
  - ko

# dataset splits
split_train: 0.8
split_val: 0.1
split_test: 0.1

# hard negative mining
hard_negative_warmup_steps: 200
hard_negative_mix_ratio: 0.7
hard_negative_mix_ramp_steps: 500

# model architecture
hidden_dim: 256
n_layers: 6
n_heads: 8
ffn_dim: 1024
dropout: 0.1
max_len: 256

# loss
loss: "infonce"
temperature: 0.07
margin: 0.3

# training
train_batch_size: 512
lr: 3e-4
epochs: 20
warmup_steps: 500
weight_decay: 0.01
refresh_every: 200
eval_every: 91
checkpoint_dir: "/scratch/vvjumle/ir-pipeline/checkpoints/"